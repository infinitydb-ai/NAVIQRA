name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q naviqra
      - name: Quickstart demo
        run: python examples/platform_quickstart.py
      - name: Local benchmark smoke test
        run: python benchmarks/v05_benchmark.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naviqra
          POSTGRES_PASSWORD: naviqra-ci-password
          POSTGRES_DB: naviqra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naviqra -d naviqra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL dependencies
        run: python -m pip install -e ".[dev,postgres]"
      - name: PostgreSQL migration and store integration
        env:
          NAVIQRA_TEST_POSTGRES_DSN: postgresql://naviqra:naviqra-ci-password@localhost:5432/naviqra_test
        run: python -m pytest -q tests/test_postgres_integration.py
